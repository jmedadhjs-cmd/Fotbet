<!DOCTYPE html>
<html>
<head>
<style>
  canvas { background:#1a1a2e; display:block; margin:auto; }
  body { text-align:center; color:white; font-family:sans-serif; }
</style>
</head>
<body>
<h2>فرقة الشوارع - نموذج أولي</h2>
<canvas id="game" width="600" height="400"></canvas>
<p>حرّك بالأسهم | اجمع الصناديق الذهبية</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const player = { x:300, y:200, size:20, speed:4, score:0 };
const coins = [];
const keys = {};

// إنشاء صناديق عشوائية
for (let i=0; i<8; i++){
  coins.push({
    x: Math.random()*560+20,
    y: Math.random()*360+20,
    r: 10,
    alive: true
  });
}

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function update(){
  if(keys["ArrowUp"]) player.y -= player.speed;
  if(keys["ArrowDown"]) player.y += player.speed;
  if(keys["ArrowLeft"]) player.x -= player.speed;
  if(keys["ArrowRight"]) player.x += player.speed;

  // حدود الشاشة
  player.x = Math.max(0, Math.min(580, player.x));
  player.y = Math.max(0, Math.min(380, player.y));

  // جمع الصناديق
  coins.forEach(c => {
    if(c.alive){
      const dx = player.x - c.x;
      const dy = player.y - c.y;
      if(Math.sqrt(dx*dx+dy*dy) < player.size){
        c.alive = false;
        player.score++;
      }
    }
  });
}

function draw(){
  ctx.clearRect(0,0,600,400);

  // الصناديق
  coins.forEach(c => {
    if(c.alive){
      ctx.fillStyle = "gold";
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
      ctx.fill();
    }
  });

  // اللاعب
  ctx.fillStyle = "#4ade80";
  ctx.fillRect(player.x-player.size/2, player.y-player.size/2,
               player.size, player.size);

  // النقاط
  ctx.fillStyle = "white";
  ctx.font = "18px sans-serif";
  ctx.fillText("النقاط: " + player.score, 15, 30);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
