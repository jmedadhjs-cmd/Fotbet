<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Arctic Coins ❄️</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(#87CEEB, #E0F6FF);
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
  }
  #game {
    position: relative;
    width: 100vw;
    height: 90vh;
    overflow: hidden;
  }
  #player {
    position: absolute;
    bottom: 20px;
    left: 50%;
    width: 50px;
    height: 50px;
    background: #FFD700;
    border-radius: 50%;
    box-shadow: 0 0 20px #FFD700;
    transition: left 0.1s;
  }
  .coin {
    position: absolute;
    width: 30px;
    height: 30px;
    background: radial-gradient(#FFF700, #FFA500);
    border-radius: 50%;
    box-shadow: 0 0 15px #FFD700;
  }
  #score {
    font-size: 24px;
    padding: 10px;
    color: #003366;
    font-weight: bold;
  }
  #snow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background-image: radial-gradient(white 2px, transparent 2px);
    background-size: 50px 50px;
    animation: snow 10s linear infinite;
    opacity: 0.6;
  }
  @keyframes snow {
    from { background-position: 0 0; }
    to { background-position: 0 100vh; }
  }
</style>
</head>
<body>
  <div id="score">النقاط: 0 ❄️</div>
  <div id="game">
    <div id="player"></div>
  </div>
  <div id="snow"></div>

<script>
  const game = document.getElementById('game');
  const player = document.getElementById('player');
  const scoreEl = document.getElementById('score');
  let score = 0;
  let playerX = window.innerWidth / 2;

  // تحريك اللاعب بالفأرة
  document.addEventListener('mousemove', (e) => {
    playerX = e.clientX - 25;
    player.style.left = playerX + 'px';
  });

  // تحريك اللاعب باللمس (للهاتف)
  document.addEventListener('touchmove', (e) => {
    playerX = e.touches[0].clientX - 25;
    player.style.left = playerX + 'px';
  });

  // إنشاء عملة جديدة
  function spawnCoin() {
    const coin = document.createElement('div');
    coin.classList.add('coin');
    coin.style.left = Math.random() * (window.innerWidth - 30) + 'px';
    coin.style.top = '-30px';
    game.appendChild(coin);

    let y = -30;
    const speed = 2 + Math.random() * 3;
    const coinX = parseFloat(coin.style.left);

    const fall = setInterval(() => {
      y += speed;
      coin.style.top = y + 'px';

      // التحقق من التصادم
      const playerRect = player.getBoundingClientRect();
      const coinRect = coin.getBoundingClientRect();

      if (
        coinRect.bottom > playerRect.top &&
        coinRect.top < playerRect.bottom &&
        coinRect.right > playerRect.left &&
        coinRect.left < playerRect.right
      ) {
        score++;
        scoreEl.textContent = 'النقاط: ' + score + ' ❄️';
        coin.remove();
        clearInterval(fall);
      }

      // حذف العملة إذا سقطت
      if (y > window.innerHeight) {
        coin.remove();
        clearInterval(fall);
      }
    }, 20);
  }

  // إنشاء عملة كل 800 ملي ثانية
  setInterval(spawnCoin, 800);
</script>
</body>
</html>
